name: Desktop acceptance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.os == 'windows-latest' && 'C:/NeuroStation-ci' || github.workspace }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      # Historical research code intentionally rejects D: access. Do not weaken
      # that guard to accommodate GitHub's default D: checkout on Windows.
      - name: Move CI checkout to permitted drive (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          git clone --no-hardlinks --local "$env:GITHUB_WORKSPACE" C:/NeuroStation-ci
          if ($LASTEXITCODE -ne 0) { throw "CI checkout failed" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt "Nuitka>=4.2,<5"
      - name: Canonical temporary paths
        shell: bash
        run: |
          python -c "import pathlib, tempfile; p = str(pathlib.Path(tempfile.gettempdir()).resolve()); print('TMPDIR='+p); print('TEMP='+p); print('TMP='+p)" >> "$GITHUB_ENV"
      - name: Install isolated CPU test dependencies
        shell: bash
        run: |
          python -m venv .venv-ci-tests
          if [ "$RUNNER_OS" = "Windows" ]; then
            TEST_PYTHON="$PWD/.venv-ci-tests/Scripts/python.exe"
          else
            TEST_PYTHON="$PWD/.venv-ci-tests/bin/python"
          fi
          "$TEST_PYTHON" -m pip install -r requirements.txt
          if [ "$RUNNER_OS" = "macOS" ]; then
            "$TEST_PYTHON" -m pip install "torch==2.2.2" "numpy<2"
          else
            "$TEST_PYTHON" -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          fi
          echo "TEST_PYTHON=$TEST_PYTHON" >> "$GITHUB_ENV"
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Sync OpenBCI GUI locked source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\sync_openbci_gui.ps1 -Action sync
          .\scripts\sync_openbci_gui.ps1 -Action overlay
          .\scripts\build_openbci_gui.ps1 -Python python
      - name: Sync OpenBCI GUI locked source (Linux/macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/sync_openbci_gui.sh sync
          bash scripts/sync_openbci_gui.sh overlay
          PYTHON=python bash scripts/build_openbci_gui.sh
      - name: Real hardware entrypoint guard
        run: python run_ssvep_session.py --validate-only --channel-config configs/channel_config_v1_auto.json
      - name: Core and integration tests
        shell: bash
        run: '"$TEST_PYTHON" -m unittest discover -s tests -v'
      - name: Independent UI tests
        shell: bash
        run: '"$TEST_PYTHON" -m unittest discover -s apps/workstation_ui/tests -v'
      - name: UI scale matrix smoke
        run: python scripts/smoke_ui_matrix.py
      - name: Syntax check
        run: python -m compileall -q apps eeg_tools tests scripts workstation.py check_cyton_live.py run_ssvep_session.py neurostation_contract.py neurostation_display.py
      - name: Build standalone application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_desktop.ps1 -Python python
      - name: Build standalone application (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: PYTHON=python bash scripts/build_desktop.sh
      - name: Packaged application smoke test (Windows/Linux)
        if: runner.os != 'macOS'
        env:
          NEUROSTATION_SKIP_PACKAGED_WORKER: "0"
        run: python scripts/smoke_packaged.py
      - name: Packaged application smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          NEUROSTATION_SKIP_PACKAGED_WORKER: "1"
        run: python scripts/smoke_packaged.py
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroStation-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.os == 'Windows' && 'C:/NeuroStation-ci/dist/**' || 'dist/**' }}
          if-no-files-found: error
